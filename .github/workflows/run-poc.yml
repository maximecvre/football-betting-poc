name: Run Football Value Betting PoC

# "workflow_dispatch" ajoute un bouton "Run workflow" dÃ©clenchable
# manuellement depuis l'onglet Actions â€” y compris depuis l'app mobile
# GitHub ou un navigateur mobile. Les deux champs ci-dessous apparaissent
# comme des paramÃ¨tres modifiables au moment du dÃ©clenchement.
on:
  workflow_dispatch:
    inputs:
      n_matches:
        description: "Nombre de matchs simulÃ©s pour l'entraÃ®nement"
        required: false
        default: "6000"
      bankroll:
        description: "Bankroll de dÃ©part (â‚¬)"
        required: false
        default: "1000"
      next_n:
        description: "Nombre de prochains matchs Ligue 1 Ã  analyser (budget API-Football : 1 + 4Ã—ce nombre requÃªtes)"
        required: false
        default: "5"

# Autorisations nÃ©cessaires pour que le job puisse publier sur GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Ã‰vite que deux dÃ©ploiements Pages se chevauchent si deux runs se suivent.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-poc:
    runs-on: ubuntu-latest
    # Ce bloc "environment" fait apparaÃ®tre l'URL de la page publiÃ©e
    # directement dans le rÃ©sumÃ© du run (et dans l'app mobile GitHub).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout du dÃ©pÃ´t
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dÃ©pendances
        run: pip install -r requirements.txt

      - name: ExÃ©cution du script
        env:
          N_MATCHES: ${{ github.event.inputs.n_matches }}
          BANKROLL: ${{ github.event.inputs.bankroll }}
          NEXT_N: ${{ github.event.inputs.next_n }}
          # Ces 3 secrets sont optionnels : absents, le script reste en
          # mode simulÃ© (comportement inchangÃ©). PrÃ©sents, il bascule
          # automatiquement sur les vraies donnÃ©es correspondantes.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LEAGUE_ID: "61"          # 61 = Ligue 1 sur API-Football
          ODDS_SPORT_KEY: "soccer_france_ligue_one"
        run: python football_value_betting_poc.py

      # Rend le CSV des value bets tÃ©lÃ©chargeable depuis le run (visible
      # aussi depuis l'app mobile, dans la page du run terminÃ©).
      - name: Sauvegarde du rÃ©sultat (CSV)
        uses: actions/upload-artifact@v4
        with:
          name: value-bets-results
          path: value_bets_output.csv

      # --- Publication du rapport HTML sur GitHub Pages ---
      - name: PrÃ©paration du dossier Ã  publier
        run: |
          mkdir -p public
          cp report.html public/index.html

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload du rapport comme artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: DÃ©ploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
